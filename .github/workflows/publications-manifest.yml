name: Update publications manifest

on:
  push:
    branches: [master]
    paths:
      - "publications/*.bib"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate manifest.json
        run: |
          cd publications
          python3 -c "
          import json, glob
          files = sorted(f.split('/')[-1] for f in glob.glob('*.bib'))
          with open('manifest.json', 'w') as f:
              json.dump(files, f, indent=2)
              f.write('\n')
          "

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications/manifest.json
          git diff --staged --quiet || git commit -m "Update publications manifest"
          git push
